[pytest]
testpaths = tests
addopts = --strict-markers -ra

# --------------------------------------------------------------------------- #
# Marker axis 1 — WHICH PILLAR does this test exercise?
#   pytest -m guardrails      # everything Pillar 1 enforces
#   pytest -m "material or alarms"
# --------------------------------------------------------------------------- #
markers =
    guardrails: Pillar 1 - input sandbox, output schema, Shadow Auditor, Economic Governor, Link Builder.
    checkpoints: Pillar 2 - explicit pass/fail gate, replay-with-feedback, 3-strike human escalation.
    material: Pillar 3 - declared SCOPE policy, least-authority field routing, isolation invariants.
    alarms: Pillar 4 - structured JSONL telemetry, severity, per-sink failure isolation.
    e2e: Drives the full LangGraph pipeline end to end rather than one component.
    threat(id): Threat-model row this test proves (see THREAT_MODEL in conftest.py).
