name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-matrix:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The suite is fully offline and deterministic: seed inventory, no network,
      # no LLM. Nothing here needs egress, which is the point.
      - name: Run the control suite
        run: pytest -q --control-matrix

      # The threat-coverage table is generated from test markers. If a test is
      # renamed, retagged, or deleted without regenerating, this fails the build
      # rather than letting the published table drift away from reality.
      - name: Verify the generated threat-coverage table is current
        run: |
          pytest --collect-only -q --control-matrix-md docs/THREAT_COVERAGE.md
          git diff --exit-code -- docs/THREAT_COVERAGE.md
